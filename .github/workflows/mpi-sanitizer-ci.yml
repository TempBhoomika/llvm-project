name: MPI Usage Sanitizer CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/**'
      - '.github/workflows/mpi-sanitizer-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/**'
      - '.github/workflows/mpi-sanitizer-ci.yml'
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: '0 2 * * *'

env:
  # LLVM version we're targeting
  LLVM_VERSION: "17"
  # Build configuration
  BUILD_TYPE: "Release"
  # Number of parallel jobs
  PARALLEL_JOBS: "4"

jobs:
  # Build and test on multiple platforms
  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04, macos-12, macos-13]
        compiler: [clang, gcc]
        exclude:
          # macOS doesn't have gcc in GitHub Actions
          - os: macos-12
            compiler: gcc
          - os: macos-13
            compiler: gcc
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Need full history for proper LLVM build
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libxml2-dev \
          libzstd-dev \
          libedit-dev \
          swig \
          python3-dev \
          libedit-dev \
          libncurses5-dev \
          libxml2-dev \
          liblzma-dev \
          libz-dev \
          pkg-config
        
        # Install MPI
        sudo apt-get install -y \
          openmpi-bin \
          openmpi-common \
          libopenmpi-dev \
          mpich \
          libmpich-dev
        
        # Install additional tools for testing
        sudo apt-get install -y \
          valgrind \
          gdb \
          strace
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install \
          cmake \
          ninja \
          python@3.11 \
          libxml2 \
          zstd \
          libedit \
          swig
        
        # Install MPI
        brew install \
          open-mpi \
          mpich
    
    - name: Setup compiler environment
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        else
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        fi
    
    - name: Cache LLVM build
      uses: actions/cache@v3
      with:
        path: |
          llvm-build
          llvm-install
        key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('llvm/**') }}
        restore-keys: |
          llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}-${{ matrix.compiler }}-
          llvm-${{ env.LLVM_VERSION }}-${{ matrix.os }}-
    
    - name: Configure LLVM build
      run: |
        mkdir -p llvm-build
        cd llvm-build
        
        cmake -G Ninja ../llvm \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=$PWD/../llvm-install \
          -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
          -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM" \
          -DLLVM_ENABLE_ASSERTIONS=ON \
          -DLLVM_ENABLE_RTTI=ON \
          -DLLVM_ENABLE_EH=ON \
          -DLLVM_INCLUDE_TESTS=ON \
          -DLLVM_INCLUDE_EXAMPLES=ON \
          -DLLVM_ENABLE_MPI_SANITIZER=ON \
          -DLLVM_MPI_SANITIZER_ENABLE_PROFILING=ON \
          -DLLVM_MPI_SANITIZER_ENABLE_OPTIMIZATION=ON \
          -DLLVM_ENABLE_PROPERTY_BASED_TESTING=ON \
          -DLLVM_PARALLEL_LINK_JOBS=2 \
          -DLLVM_PARALLEL_COMPILE_JOBS=${{ env.PARALLEL_JOBS }}
    
    - name: Build LLVM with MPI Sanitizer
      run: |
        cd llvm-build
        
        # Build core LLVM components first
        ninja llvm-config opt FileCheck count not
        
        # Build MPI Sanitizer components
        ninja LLVMMPIUsageSanitizerComponents
        
        # Build clang for integration testing
        ninja clang
        
        # Build testing tools
        ninja llvm-lit
    
    - name: Install LLVM
      run: |
        cd llvm-build
        ninja install
        
        # Add to PATH for subsequent steps
        echo "$PWD/../llvm-install/bin" >> $GITHUB_PATH
    
    - name: Verify MPI Sanitizer installation
      run: |
        # Check if the pass is available
        opt -load-pass-plugin=lib/LLVMMPIUsageSanitizerComponents.so -passes=help | grep mpi-sanitizer || {
          echo "MPI Sanitizer pass not found in opt"
          exit 1
        }
        
        # Check if clang can load the plugin
        echo 'int main(){return 0;}' > test.c
        clang -fpass-plugin=lib/LLVMMPIUsageSanitizerComponents.so test.c -o test || {
          echo "Clang cannot load MPI Sanitizer plugin"
          exit 1
        }
        rm -f test test.c
      working-directory: llvm-install
    
    - name: Run MPI Sanitizer unit tests
      run: |
        cd llvm-build
        
        # Run unit tests
        ninja check-mpi-sanitizer || {
          echo "Unit tests failed"
          exit 1
        }
    
    - name: Build and test example programs
      run: |
        cd llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/examples
        
        # Set environment variables
        export LLVM_DIR=$PWD/../../../../../llvm-install
        export PATH=$LLVM_DIR/bin:$PATH
        
        # Build examples
        cd build_scripts
        ./build_all.sh
        
        # Test basic functionality
        cd ../build
        
        # Test uninstrumented version
        timeout 30s ./run_uninstrumented.sh basic/hello_world -np 2 || {
          echo "Uninstrumented hello_world failed"
          exit 1
        }
        
        # Test instrumented version
        timeout 30s ./run_instrumented.sh basic/hello_world -np 2 || {
          echo "Instrumented hello_world failed"
          exit 1
        }
        
        # Test send/recv example
        timeout 30s ./run_instrumented.sh basic/send_recv -np 2 || {
          echo "Instrumented send_recv failed"
          exit 1
        }
    
    - name: Run performance benchmarks
      run: |
        cd llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/examples/build
        
        # Run performance comparison
        ./performance_comparison.sh basic/hello_world -np 2 > perf_results.txt
        
        # Check that overhead is reasonable (< 50%)
        python3 -c "
import re
with open('perf_results.txt', 'r') as f:
    content = f.read()
    
overhead_match = re.search(r'Overhead: [0-9.]+s \(([0-9.]+)%\)', content)
if overhead_match:
    overhead = float(overhead_match.group(1))
    print(f'Performance overhead: {overhead}%')
    if overhead > 50.0:
        print('ERROR: Performance overhead too high!')
        exit(1)
    else:
        print('Performance overhead acceptable')
else:
    print('Could not parse performance results')
    exit(1)
        "
    
    - name: Run property-based tests
      run: |
        cd llvm-build
        
        # Run property-based tests with extended iterations
        export MPI_SANITIZER_PBT_ITERATIONS=100
        
        # Run specific property tests
        ./unittests/Transforms/Instrumentation/MPIUsageSanitizerTests || {
          echo "Property-based tests failed"
          exit 1
        }
    
    - name: Generate test coverage report
      if: matrix.os == 'ubuntu-22.04' && matrix.compiler == 'clang'
      run: |
        # Install coverage tools
        sudo apt-get install -y lcov
        
        # Generate coverage report
        cd llvm-build
        ninja coverage-mpi-sanitizer || echo "Coverage generation failed (non-fatal)"
    
    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-artifacts-${{ matrix.os }}-${{ matrix.compiler }}
        path: |
          llvm-build/test-results/
          llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/examples/build/perf_results.txt
          llvm-build/Testing/
        retention-days: 7

  # Test with different MPI implementations
  test-mpi-implementations:
    name: Test MPI Implementations (${{ matrix.mpi }})
    runs-on: ubuntu-22.04
    needs: build-and-test
    
    strategy:
      fail-fast: false
      matrix:
        mpi: [openmpi, mpich, intel-mpi]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install MPI implementation
      run: |
        sudo apt-get update
        
        case "${{ matrix.mpi }}" in
          openmpi)
            sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev
            ;;
          mpich)
            sudo apt-get install -y mpich libmpich-dev
            ;;
          intel-mpi)
            # Intel MPI requires special setup - skip for now
            echo "Intel MPI testing not implemented yet"
            exit 0
            ;;
        esac
    
    - name: Restore LLVM build cache
      uses: actions/cache@v3
      with:
        path: |
          llvm-build
          llvm-install
        key: llvm-${{ env.LLVM_VERSION }}-ubuntu-22.04-clang-${{ hashFiles('llvm/**') }}
    
    - name: Test with specific MPI implementation
      run: |
        export PATH=$PWD/llvm-install/bin:$PATH
        
        cd llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/examples
        
        # Override MPI compiler
        case "${{ matrix.mpi }}" in
          openmpi)
            export MPICC=mpicc.openmpi
            export MPIRUN=mpirun.openmpi
            ;;
          mpich)
            export MPICC=mpicc.mpich
            export MPIRUN=mpirun.mpich
            ;;
        esac
        
        # Build and test examples
        cd build_scripts
        ./build_all.sh
        
        cd ../build
        timeout 30s ./run_instrumented.sh basic/hello_world -np 2

  # Integration tests with real-world MPI applications
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openmpi-bin openmpi-common libopenmpi-dev \
          git wget
    
    - name: Restore LLVM build cache
      uses: actions/cache@v3
      with:
        path: |
          llvm-build
          llvm-install
        key: llvm-${{ env.LLVM_VERSION }}-ubuntu-22.04-clang-${{ hashFiles('llvm/**') }}
    
    - name: Test with real MPI applications
      run: |
        export PATH=$PWD/llvm-install/bin:$PATH
        
        # Create test directory
        mkdir integration-tests
        cd integration-tests
        
        # Test 1: Simple matrix multiplication
        cat > matrix_mult.c << 'EOF'
#include <mpi.h>
#include <stdio.h>
#include <stdlib.h>

int main(int argc, char** argv) {
    MPI_Init(&argc, &argv);
    
    int rank, size;
    MPI_Comm_rank(MPI_COMM_WORLD, &rank);
    MPI_Comm_size(MPI_COMM_WORLD, &size);
    
    int n = 100;
    double *a = malloc(n * sizeof(double));
    double *b = malloc(n * sizeof(double));
    
    // Initialize data
    for (int i = 0; i < n; i++) {
        a[i] = rank * n + i;
        b[i] = i;
    }
    
    // Simple reduction
    double local_sum = 0.0;
    for (int i = 0; i < n; i++) {
        local_sum += a[i] * b[i];
    }
    
    double global_sum;
    MPI_Allreduce(&local_sum, &global_sum, 1, MPI_DOUBLE, MPI_SUM, MPI_COMM_WORLD);
    
    if (rank == 0) {
        printf("Global sum: %f\n", global_sum);
    }
    
    free(a);
    free(b);
    MPI_Finalize();
    return 0;
}
EOF
        
        # Compile with MPI Sanitizer
        clang -fpass-plugin=$PWD/../llvm-install/lib/LLVMMPIUsageSanitizerComponents.so \
              -mllvm -passes=mpi-sanitizer \
              -mllvm -mpi-sanitizer-level=standard \
              matrix_mult.c -o matrix_mult -lmpi -lmpi_sanitizer_runtime
        
        # Run the test
        timeout 60s mpirun -np 4 ./matrix_mult
        
        echo "Integration tests completed successfully"

  # Documentation and code quality checks
  quality-checks:
    name: Code Quality and Documentation
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang-format \
          clang-tidy \
          doxygen \
          graphviz \
          python3-pip
        
        pip3 install \
          cpplint \
          lizard \
          sphinx \
          breathe
    
    - name: Check code formatting
      run: |
        # Check if code follows LLVM formatting standards
        find llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer \
          -name "*.cpp" -o -name "*.h" | \
          xargs clang-format --dry-run --Werror
    
    - name: Run static analysis
      run: |
        # Run clang-tidy on source files
        find llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer \
          -name "*.cpp" | \
          xargs clang-tidy \
            --checks='-*,llvm-*,readability-*,performance-*,modernize-*' \
            --warnings-as-errors='*' || echo "Static analysis warnings found"
    
    - name: Check code complexity
      run: |
        # Check cyclomatic complexity
        lizard llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer \
          --CCN 15 --length 100 --arguments 10
    
    - name: Generate documentation
      run: |
        cd llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer
        
        # Generate Doxygen documentation
        doxygen docs/Doxyfile || echo "Documentation generation completed with warnings"
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/docs/html/
        retention-days: 30

  # Performance regression testing
  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-22.04
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openmpi-bin openmpi-common libopenmpi-dev \
          python3-pip time
        
        pip3 install matplotlib numpy scipy
    
    - name: Restore LLVM build cache
      uses: actions/cache@v3
      with:
        path: |
          llvm-build
          llvm-install
        key: llvm-${{ env.LLVM_VERSION }}-ubuntu-22.04-clang-${{ hashFiles('llvm/**') }}
    
    - name: Run performance regression tests
      run: |
        export PATH=$PWD/llvm-install/bin:$PATH
        
        cd llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/examples
        
        # Build examples
        cd build_scripts
        ./build_all.sh
        
        # Run comprehensive performance tests
        cd ..
        python3 benchmark_optimization.py --validate-performance --iterations=10
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: |
          llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/examples/performance_results.json
          llvm/lib/Transforms/Instrumentation/MPIUsageSanitizer/examples/performance_plots/
        retention-days: 30

# Summary job that depends on all others
summary:
  name: CI Summary
  runs-on: ubuntu-22.04
  needs: [build-and-test, test-mpi-implementations, integration-tests, quality-checks, performance-regression]
  if: always()
  
  steps:
  - name: Check overall status
    run: |
      echo "Build and Test: ${{ needs.build-and-test.result }}"
      echo "MPI Implementations: ${{ needs.test-mpi-implementations.result }}"
      echo "Integration Tests: ${{ needs.integration-tests.result }}"
      echo "Quality Checks: ${{ needs.quality-checks.result }}"
      echo "Performance Regression: ${{ needs.performance-regression.result }}"
      
      if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
        echo "❌ Core build and test failed"
        exit 1
      fi
      
      echo "✅ MPI Usage Sanitizer CI completed successfully"