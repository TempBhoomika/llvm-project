name: MPI Usage Sanitizer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            python3-dev \
            libxml2-dev \
            libzstd-dev \
            libedit-dev \
            libncurses5-dev \
            liblzma-dev \
            libz-dev \
            pkg-config \
            clang \
            clang-tools \
            lld \
            openmpi-bin \
            openmpi-common \
            libopenmpi-dev \
            mpich \
            libmpich-dev

      - name: Install Python packages
        run: |
          pip install \
            lit \
            pytest \
            pyyaml \
            jinja2

      - name: Configure LLVM
        run: |
          mkdir -p llvm-build
          cd llvm-build

          cmake -G Ninja ../llvm \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX=$PWD/../llvm-install \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_EH=ON \
            -DLLVM_INCLUDE_TESTS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
      - name: Dump CMake logs on failure
        if: failure()
        run: |
          cat llvm-build/CMakeFiles/CMakeError.log || true
          cat llvm-build/CMakeFiles/CMakeOutput.log || true

      - name: Build LLVM
        run: |
          cd llvm-build

          ninja llvm-config
          ninja opt
          ninja clang
          ninja llvm-lit

      - name: Build MPI Sanitizer
        run: |
          cd llvm-build

          ninja LLVMMPIUsageSanitizerComponents || true

      - name: Install
        run: |
          cd llvm-build
          ninja install

      - name: Add LLVM to PATH
        run: |
          echo "$GITHUB_WORKSPACE/llvm-install/bin" >> $GITHUB_PATH

      - name: Verify MPI
        run: |
          mpicc --version
          mpirun --version

      - name: Verify Plugin
        run: |
          if [ -f llvm-install/lib/LLVMMPIUsageSanitizerComponents.so ]; then
            echo "Plugin found"
          else
            echo "Plugin missing"
            exit 1
          fi

      - name: Run Tests
        run: |
          cd llvm-build

          ninja check-mpi-sanitizer

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            llvm-build
